<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <header class="hero">
    <div class="hero-content">
      <h1>{{ site.title }}</h1>
      <p class="hero-tagline">{{ site.description }}</p>
      <div class="hero-buttons">
        <a href="https://github.com/NextBep/BepInEx.Android.Launcher/releases" class="btn btn-primary">Download Launcher</a>
        <a href="https://github.com/NextBep/BepInEx.Android" class="btn btn-secondary">View Source</a>
      </div>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="footer">
    <div class="container">
      <p>© 2026 NextBep · Open Source under MIT License</p>
    </div>
  </footer>
</body>
</html>
